name: Sync README from resume.json

on:
  schedule:
    # Fallback only: the site's deploy dispatches this workflow after every
    # publish. Daily at 09:00 UTC catches anything that slipped through.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: resume.json URL to build from (defaults to the live site)
        required: false
        default: ''
  push:
    paths:
      - scripts/generate-readme.mjs
      - assets/banner.svg

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate README.md from resume.json
        # Passed through env, not interpolated into the script, so the input
        # can't inject shell.
        env:
          SOURCE: ${{ inputs.source }}
        run: node scripts/generate-readme.mjs ${SOURCE:+"$SOURCE"}

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README from resume.json"
          git push
